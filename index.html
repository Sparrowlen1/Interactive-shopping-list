<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparrowln Interactive Shopping List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/6ae23c62b1.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="app-container">
        <div class="app-header">
            <i class="fas fa-leaf header-icon"></i>
            <h1>Sparrowlen <span class="badge">Shopping List</span></h1>
        </div>
        <div class="shopping-card">
            <div class="add-section">
                <div class="input-group">
                    <input type="text" id="itemNameInput" placeholder="maembe from kitui" autocomplete="off">
                    <button id="addBtn" class="btn btn-primary"><i class="fas fa-plus-circle"></i>Add item</button>
                </div>
                <div class="input-group-cost">
                    <input type="number" id="itemCostInput" placeholder="    cost (ksh)" step="0.01" min="0">
                    <span class="cost-symbol"><i class="fa-solid fa-money-bill"></i></span>
                </div>
            </div>
            <div class="stats-bar">
                <div class="stats-item">
                    <i class="fas fa-cart-shopping"></i>
                    <span id="itemCount">0</span>items
                </div>
                <div class="stats-item total-cost-box">
                    <i class="fas fa-money-bill"></i>Total Cost:
                    <span id="totalCostDisplay">ksh0.00</span>
                </div>
                <button id="clearAllBtn" class="btn btn-danger"><i class="fas fa-trash-alt"></i>Clear List</button>
            </div>

            <div class="list-container" id="shoppingListContainer">
                <div class="empty-placeholder" id="emptyPlaceholder">
                    <i class="fas fa-basket-shopping"></i>
                    <p>Your shopping list is empty <br> Add some groceries</p>
                </div>
                <ul id="shoppingListUl" class="shopping-list-ul"></ul>
            </div>

            <div class="footer-note">
                <i class="fas fa-mouse-pointer"></i> Click on any item mark as purchased
                | <i class="fas fa-pen"></i> Edit <i class="fas fa-pencil-alt"></i> icon
                <p>&copy; 2023 Sparrowlen Shopping List. All rights reserved.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
